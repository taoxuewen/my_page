{% extends "base.html" %}

{% block title %}{{ app.name }} — AI Studio{% endblock %}

{% block extra_css %}<link rel="stylesheet" href="/static/css/style.css">{% endblock %}

{% block nav %}
<nav class="site-nav">
  <div class="container site-nav__inner">
    <a href="/" class="site-nav__brand"><span class="brand-mark">✶</span> AI Studio</a>
    <a href="/" class="site-nav__back">← 返回首页</a>
  </div>
</nav>
{% endblock %}

{% block content %}
<div class="container">
  <div class="app-shell">
    <header class="app-shell__header">
      <p class="eyebrow">AI 应用</p>
      <h1 class="app-shell__title">{{ app.name }}</h1>
    </header>

    <div class="app-io">
      <div class="field">
        <label for="userInput">输入内容</label>
        <textarea id="userInput" placeholder="请输入您的内容..."></textarea>
      </div>
      <button id="submitBtn" class="btn btn--primary">提交</button>

      <div id="outputArea" class="card app-io__output">
        <p class="placeholder">结果将显示在这里</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/app.js"></script>
<script>
  const currentAppId = '{{ app.id }}';
</script>
{% endblock %}
