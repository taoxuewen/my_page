<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Studio{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-system.css">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block nav %}{% endblock %}

  <main>{% block content %}{% endblock %}</main>

  {% block footer %}
  <footer class="site-footer">
    <div class="container">© 2026 逃学文 · AI Studio</div>
  </footer>
  {% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
