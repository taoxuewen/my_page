<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI应用平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <h1>AI Studio</h1>
            </div>
            <p class="subtitle">探索人工智能的无限可能</p>
        </header>
        
        <main class="main">
            <div class="apps-grid">
                {% for app in apps %}
                <a href="{{ app.route }}" class="app-card">
                    <div class="app-icon">{{ app.icon }}</div>
                    <h2 class="app-name">{{ app.name }}</h2>
                    <p class="app-description">{{ app.description }}</p>
                </a>
                {% endfor %}
            </div>
        </main>
        
        <footer class="footer">
            <p>© 2026 AI Studio. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
